name: Daily Foreign Crime News Collector & Static Rebuilder

on:
  schedule:
    # 24時間 毎時（1時間に1回）自動巡回・速報検知時に何度でも即時反映
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-news-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 変更されたファイルのCommit/Push権限を明示的に付与
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Fetch News Script
        run: node scripts/fetch-news.cjs

      - name: Build and Prerender Static Pages
        run: npm run build

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsData.json NETLIFY_UPLOAD/ public/note-articles.json dist/
          git diff --staged --quiet || (git commit -m "auto: 毎時自動巡回 外国人犯罪ニュース更新＆全ページ再ビルド $(date -u +%Y-%m-%dT%H:%M)" && git push)

      - name: Submit URLs to IndexNow (Bing / Search Engines)
        run: node scripts/submit-indexnow.cjs
