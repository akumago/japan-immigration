name: Daily Foreign Crime News Collector

on:
  schedule:
    # 毎日 日本時間 18:00 (UTC 09:00) に自動実行
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 変更されたファイルのCommit/Push権限を明示的に付与
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Fetch News Script
        run: node scripts/fetch-news.js

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsData.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 毎日18:00 最新外国人犯罪ニュース全自動更新" && git push)
