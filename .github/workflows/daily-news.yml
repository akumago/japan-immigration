name: Daily Foreign Crime News Collector & Static Rebuilder

on:
  schedule:
    # 毎時17分（正時の混雑を避ける）
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily-news.yml'
      - 'package.json'
      - 'package-lock.json'

# 実行の重なり（cron遅延など）でキャッシュ・Gitが競合しないようにする
concurrency:
  group: daily-news-collector
  cancel-in-progress: false

jobs:
  update-news-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ゲートの回帰テスト。落ちたらデプロイしない
      - name: Run gate regression tests
        # Node 22 の隔離ワーカーで E2E のHTTPサーバーが異常終了する環境差を避ける。
        # テストは共有状態に依存しないため、Actionsでも単一プロセスで実行する。
        run: node --experimental-test-isolation=none --test "scripts/lib/*.test.cjs"

      # 候補キューおよび本文キャッシュの状態（新着0件の時間帯でも持ち越す）
      - name: Restore pipeline state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/articleCache.json
            data/newsQueue.json
            data/pipelineMetrics.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-state-

      - name: Run Fetch News Script
        id: fetch-news
        run: node scripts/fetch-news.cjs
        env:
          # Gemini完全撤去：完全ローカル・決定論的ルール判定のみで稼働（キー・モデル指定なし）
          # 既定は本番稼働。シャドーに戻すときはリポジトリ変数 SHADOW_MODE を 1 にする
          SHADOW_MODE: ${{ vars.SHADOW_MODE || '0' }}
          # 本文スキャン有効化（1:有効 / 0:無効）。障害時はリポジトリ変数 BODY_SCAN を 0 にするだけで即時停止可能
          BODY_SCAN: ${{ vars.BODY_SCAN || '1' }}
          BODY_SCAN_MAX: ${{ vars.BODY_SCAN_MAX || '100' }}

      # ニュースデータに変更があった時だけビルド・コミット・push（= Netlifyのデプロイ）を行う
      - name: Check for news data changes
        id: check-diff
        run: |
          if [ -n "$(git status --porcelain data/newsData.json)" ]; then
            echo "has_news_changes=true" >> "$GITHUB_OUTPUT"
            echo "News data changed. Proceeding to build and commit."
          else
            echo "has_news_changes=false" >> "$GITHUB_OUTPUT"
            echo "No news data changes. Skipping build, commit and deploy."
          fi

      - name: Build and Prerender Static Pages
        if: steps.check-diff.outputs.has_news_changes == 'true'
        run: npm run build

      - name: Commit, Sync and Push
        if: steps.check-diff.outputs.has_news_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: 新着外国人犯罪ニュース更新＆全ページ再ビルド"
          pushed=0
          for i in 1 2 3; do
            # -X theirs は使わない（手動編集を上書きしない）。失敗したら rebase を畳んでやり直す
            if git pull --rebase --autostash origin main && git push origin main; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::push failed after 3 retries"
            exit 1
          fi

      - name: Submit URLs to IndexNow
        if: steps.check-diff.outputs.has_news_changes == 'true'
        continue-on-error: true # 通知の失敗でジョブ全体（キャッシュ保存）を落とさない
        run: node scripts/submit-indexnow.cjs

      # 成功した実行だけ状態を保存する（push失敗＝未公開なのに「済み」になるのを防ぐ）。変更が無ければ保存しない
      - name: Save pipeline state cache
        if: success() && steps.fetch-news.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/articleCache.json
            data/newsQueue.json
            data/pipelineMetrics.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      # シャドー運転の比較ログ（累積）。Actions画面からいつでもダウンロードできる
      - name: Upload shadow comparison log
        if: always() && hashFiles('data/shadowComparison.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shadow-comparison
          path: data/shadowComparison.jsonl
          retention-days: 14
          overwrite: true

      - name: Upload pipeline coverage metrics
        if: always() && hashFiles('data/pipelineMetrics.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-coverage-${{ github.run_number }}
          path: data/pipelineMetrics.json
          retention-days: 14
