name: Daily Foreign Crime News Collector & Static Rebuilder

on:
  schedule:
    # 24時間 毎時（1時間に1回）自動巡回・速報検知時に何度でも即時反映
    - cron: '17 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-news-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 変更されたファイルのCommit/Push権限を明示的に付与
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Fetch News Script
        run: node scripts/fetch-news.cjs

      - name: Build and Prerender Static Pages
        run: npm run build

      - name: Commit, Sync and Push if changed
        id: commit-push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "auto: 毎時自動巡回 外国人犯罪ニュース更新＆全ページ再ビルド"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Submit URLs to IndexNow (Bing / Search Engines)
        if: steps.commit-push.outputs.has_changes == 'true'
        run: node scripts/submit-indexnow.cjs
