<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 お探しのページは見つかりませんでした | 日本の岐路</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/czmZ4h.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: linear-gradient(135deg, #161b22, #0d1117);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .error-code {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c9d1d9;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>お探しのページは見つかりませんでした</h1>
    <p>
      アクセスいただいたページは、URLが変更されたか、現在非公開になっている可能性があります。以下のリンクよりトップページまたは各分析レポートをご利用ください。
    </p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">トップページへ戻る</a>
      <a href="/analysis-archive/" class="btn btn-secondary">分析レポート一覧</a>
      <a href="/analysis/crime-news/" class="btn btn-secondary">最新犯罪速報</a>
    </div>
    <div class="footer-note">
      日本の岐路：外国人労働者受け入れ政策の構造的課題と国民経済への影響
    </div>
  </div>
</body>
</html>
